[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tumortwin"
version = "0.1.0"
description = "Reproducible exploratory analysis of longitudinal preclinical tumour data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rdata>=1.0",
    "scipy>=1.15",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
tumortwin = "tumortwin.cli:main"

[project.optional-dependencies]
timestral = [
    "timestral",
    "torch>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
